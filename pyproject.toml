[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runnerpoker-mcp"
version = "0.2.0"
description = "Unofficial read-only MCP server for RunnerPoker Craft timelines"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1"]

[project.scripts]
runnerpoker-mcp = "runnerpoker_mcp.server:main"
runnerpoker-auth = "runnerpoker_mcp.auth:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
